# Release: al subir una etiqueta `v*` compila la app y el CLI en Windows, macOS y Linux y
# publica un release de GitHub con el instalador NSIS y el .exe portable, el .dmg, el .AppImage y el
# .deb, el CLI `runpost_mcp` suelto por plataforma y SHA256SUMS.txt. El instalador lleva también
# `runpost_mcp` junto a la app (lo usa "Conectar agente"). Solo acciones oficiales, fijadas por SHA.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
          - name: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the app version
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            apps/desktop/package-lock.json

      - name: Linux dependencies (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: CLI next to the app (Tauri sidecar)
        run: |
          cargo build --release -p runpost-cli
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/release/runpost_mcp${ext}" "apps/desktop/src-tauri/binaries/runpost_mcp-${triple}${ext}"

      - name: App and installers
        working-directory: apps/desktop
        run: |
          npm ci --ignore-scripts
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Collect assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              cp target/release/bundle/nsis/*.exe dist/
              cp target/release/runpost_app.exe "dist/RunPost_${version}_x64-portable.exe"
              cp target/release/runpost_mcp.exe "dist/runpost_mcp_${version}_windows-x64.exe"
              ;;
            macOS)
              cp target/release/bundle/dmg/*.dmg dist/
              tar -czf "dist/runpost_mcp_${version}_macos-arm64.tar.gz" -C target/release runpost_mcp
              ;;
            Linux)
              cp target/release/bundle/appimage/*.AppImage dist/
              cp target/release/bundle/deb/*.deb dist/
              tar -czf "dist/runpost_mcp_${version}_linux-x64.tar.gz" -C target/release runpost_mcp
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RunPost ${GITHUB_REF_NAME}" \
            --generate-notes
